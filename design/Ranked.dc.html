<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #faf8f3; color: #2b2622; }
    a { color: #cb5a39; } a:hover { color: #a8472d; }
    .fr { font-family: Fraunces, Georgia, serif; }
    .tnum { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="padding: 40px 44px; width: 780px; box-sizing: border-box;">

  <p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(43,38,34,0.45);">August 11 &middot; 2m 11s</p>

  <div style="display: flex; align-items: baseline; gap: 14px; margin-top: 14px;">
    <p class="tnum fr" style="margin: 0; font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -0.03em;">7<span style="font-size: 20px; color: rgba(43,38,34,0.35);">/10</span></p>
    <p class="fr" style="margin: 0; font-size: 19px; font-weight: 500; line-height: 1.35; color: rgba(43,38,34,0.8); max-width: 28ch;">Five of six measures on target. Eye contact is the one to fix.</p>
  </div>

  <div style="margin-top: 32px; display: flex; flex-direction: column; gap: 0;">

    <div style="display: flex; align-items: center; gap: 16px; padding: 13px 0; border-bottom: 1px solid #f1ece2;">
      <span style="width: 96px; flex-shrink: 0; font-size: 13px; font-weight: 600;">Eye contact</span>
      <div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #f1ece2; position: relative;">
        <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 60%; border-radius: 4px; background: #e0714f;"></div>
        <div style="position: absolute; top: -3px; bottom: -3px; left: 80%; width: 2px; background: rgba(43,38,34,0.22);"></div>
      </div>
      <span class="tnum" style="width: 62px; flex-shrink: 0; text-align: right; font-size: 13px; font-weight: 600;">68%</span>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 13px 0; border-bottom: 1px solid #f1ece2;">
      <span style="width: 96px; flex-shrink: 0; font-size: 13px; font-weight: 600;">Vocabulary</span>
      <div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #f1ece2; position: relative;">
        <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 70%; border-radius: 4px; background: #f6cabb;"></div>
        <div style="position: absolute; top: -3px; bottom: -3px; left: 50%; width: 2px; background: rgba(43,38,34,0.22);"></div>
      </div>
      <span class="tnum" style="width: 62px; flex-shrink: 0; text-align: right; font-size: 13px; font-weight: 600;">54%</span>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 13px 0; border-bottom: 1px solid #f1ece2;">
      <span style="width: 96px; flex-shrink: 0; font-size: 13px; font-weight: 600;">Fillers</span>
      <div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #f1ece2; position: relative;">
        <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 70%; border-radius: 4px; background: #f6cabb;"></div>
        <div style="position: absolute; top: -3px; bottom: -3px; left: 62%; width: 2px; background: rgba(43,38,34,0.22);"></div>
      </div>
      <span class="tnum" style="width: 62px; flex-shrink: 0; text-align: right; font-size: 13px; font-weight: 600;">6</span>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 13px 0; border-bottom: 1px solid #f1ece2;">
      <span style="width: 96px; flex-shrink: 0; font-size: 13px; font-weight: 600;">Flow</span>
      <div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #f1ece2; position: relative;">
        <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 80%; border-radius: 4px; background: #f6cabb;"></div>
        <div style="position: absolute; top: -3px; bottom: -3px; left: 62%; width: 2px; background: rgba(43,38,34,0.22);"></div>
      </div>
      <span class="tnum" style="width: 62px; flex-shrink: 0; text-align: right; font-size: 13px; font-weight: 600;">2 pauses</span>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 13px 0; border-bottom: 1px solid #f1ece2;">
      <span style="width: 96px; flex-shrink: 0; font-size: 13px; font-weight: 600;">Articulation</span>
      <div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #f1ece2; position: relative;">
        <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 80%; border-radius: 4px; background: #f6cabb;"></div>
        <div style="position: absolute; top: -3px; bottom: -3px; left: 85%; width: 2px; background: rgba(43,38,34,0.22);"></div>
      </div>
      <span class="tnum" style="width: 62px; flex-shrink: 0; text-align: right; font-size: 13px; font-weight: 600;">91%</span>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 13px 0;">
      <span style="width: 96px; flex-shrink: 0; font-size: 13px; font-weight: 600;">Pace</span>
      <div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #f1ece2; position: relative;">
        <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 90%; border-radius: 4px; background: #f6cabb;"></div>
        <div style="position: absolute; top: -3px; bottom: -3px; left: 62%; width: 2px; background: rgba(43,38,34,0.22);"></div>
      </div>
      <span class="tnum" style="width: 62px; flex-shrink: 0; text-align: right; font-size: 13px; font-weight: 600;">142 WPM</span>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 18px; margin-top: 18px;">
    <span style="display: flex; align-items: center; gap: 7px; font-size: 11px; color: rgba(43,38,34,0.45);">
      <span style="display: inline-block; width: 14px; height: 6px; border-radius: 3px; background: #e0714f;"></span>Below target
    </span>
    <span style="display: flex; align-items: center; gap: 7px; font-size: 11px; color: rgba(43,38,34,0.45);">
      <span style="display: inline-block; width: 2px; height: 12px; background: rgba(43,38,34,0.22);"></span>Target
    </span>
  </div>

</div>
</x-dc>

</html>
